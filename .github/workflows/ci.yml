name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --group dev --extra mcp
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests/unit
      - name: Run example smoke
        run: bash runs/run_bash_agent_demo.sh

  type-check:
    name: ty / src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --group dev --extra mcp
      - name: Run ty check
        run: uv run ty check src

  docs-lint:
    name: docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --group dev
      - name: Run docs lint
        run: uv run python scripts/lint_docs.py

  arch-lint:
    name: architecture lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --group dev
      - name: Run architecture lint
        run: uv run python scripts/arch_lint.py

  format:
    name: ruff format / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --group dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
