[project]
name = "simple-agent-lab"
version = "0.1.0"
description = "Tiny message-first agent runtime for learning, comparing, and building small agent systems."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "yesiyu.andy", email = "andyyesiyu@gmail.com" },
]
keywords = ["agent", "llm", "runtime", "education", "research", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.39.0",
    "filelock>=3.13.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
swebench = [
    "datasets>=2.0.0",
    "docker>=7.0.0",
    "swebench>=3.0.0",
    # The official SWE-bench Pro evaluator (scaleapi/SWE-bench_Pro-os) imports
    # pandas; bundling it here keeps `--pro --run-official` a single command.
    "pandas>=1.5.0",
]
programbench = [
    # docker-py drives LocalDockerBackend; programbench is the official scorer
    # (and the bundled task set) used by evals/programbench/evaluate_submissions.py.
    "docker>=7.0.0",
    "programbench>=1.0.0",
]
mcp = [
    # 1.10.0 is the first release with ResourceLink, AudioContent, and
    # CallToolResult.structuredContent, all of which the integration uses.
    "mcp>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/simple-agent-lab/simple-agent-lab"
Repository = "https://github.com/simple-agent-lab/simple-agent-lab"
Issues = "https://github.com/simple-agent-lab/simple-agent-lab/issues"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.1a26",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_agent_lab"]
# The bundled skill library (src/simple_agent_lab/skills/library) ships as
# package data: hatchling includes the non-Python files (README.md and any
# SKILL.md/scripts added later) because they live inside the package tree.
artifacts = ["src/simple_agent_lab/skills/library/**"]
