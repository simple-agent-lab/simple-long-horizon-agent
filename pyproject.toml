[project]
name = "simple-agent-lab"
version = "0.1.0"
description = "Tiny message-first agent runtime for learning, comparing, and building small agent systems."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "yesiyu.andy", email = "andyyesiyu@gmail.com" },
]
keywords = ["agent", "llm", "runtime", "education", "research", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.39.0"]
openai = ["openai>=1.50.0"]
providers = ["anthropic>=0.39.0", "openai>=1.50.0"]

[project.urls]
Homepage = "https://github.com/simple-agent-lab/simple-agent-lab"
Repository = "https://github.com/simple-agent-lab/simple-agent-lab"
Issues = "https://github.com/simple-agent-lab/simple-agent-lab/issues"
Changelog = "https://github.com/simple-agent-lab/simple-agent-lab/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ty>=0.0.1a26",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_agent_lab"]
