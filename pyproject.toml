[project]
name = "simple-agent-lab"
version = "0.0.0"
description = "Tiny message-first multi-agent runtime for learning and comparison."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_agent_lab"]
